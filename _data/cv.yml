  website: https://ricardo-wen.github.io/personal-website/
  location: Hong Kong SAR / Xi'an, China
  image: ""
  summary: >
    My research examines the disruptive impacts of IT innovations on individuals,
    organizations, and urban systems, and the design of data-driven decision systems.
    I use causal inference, structural modeling, optimization algorithms, and large-scale
    behavioral data to generate actionable insights for business leaders and policymakers.

  sections:
    Research Interests:
      - name: Urban Transportation Spillovers and Network Design
        summary: >
          Socioeconomic spillovers of urban transportation infrastructure, especially
          bike-sharing, on mobility patterns, business outcomes, taxi markets, crime,
          traffic safety, and social welfare.
      - name: Human Mobility Analysis and Application
        summary: >
          Population-scale GPS trajectory data for modeling individual spatiotemporal
          behavior and applying mobility analytics to urban business optimization and
          sequential decision settings.
      - name: LLM-Driven Operations Management Optimization
        summary: >
          Multi-agent LLM systems for intent-driven recommendation, personalized persuasion,
          domain knowledge organization, and latent insight extraction.

